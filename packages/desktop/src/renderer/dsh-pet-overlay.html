<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>XCode DSH Pet</title>
    <style>
      /* 上首软糖体随应用内置（预置资源）：素材包只负责动作与表情包，字体不再下载。
         字体走同源静态文件，绕开 @font-face 的跨源校验（zcode-media 协议带不了 CORS
         响应头，之前用协议地址加载会被静默拒绝）。文件缺失时仍回落系统字体栈。 */
      @font-face {
        font-family: "ShangshouSoftCandy";
        src: url("pets-dsh/font/%E4%B8%8A%E9%A6%96%E8%BD%AF%E7%B3%96%E4%BD%93.ttf")
          format("truetype");
        font-display: swap;
        font-weight: 400;
        font-style: normal;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      /* 舞台：宠物包围盒（视频盒），外层 padding 由渲染层按窗口余量设置。 */
      #stage {
        position: relative;
        transform-origin: 50% 100%;
        will-change: transform;
      }
      /* 命中区容器：只有身体命中区可交互（实际穿透由主进程光标轮询翻转）。 */
      #pet {
        position: relative;
        cursor: grab;
      }
      #pet:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="pet" aria-hidden="true"></div>
    </div>
    <script type="module" src="./dshPetOverlay.ts"></script>
  </body>
</html>
